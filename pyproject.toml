[project]
name = "fed-twin"
version = "0.1.0"
description = "Federated Digital Twin Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.42.48",
    "google-cloud-storage==3.9.0",
    "gymnasium==1.2.3",
    "jinja2==3.1.6",
    "kfp==2.15.2",
    "kfp-pipeline-spec==2.15.2",
    "kfp-server-api==2.15.2",
    "kubernetes==30.1.0",
    "matplotlib==3.10.8",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "seaborn==0.13.2",
    "torch==2.2.2",
    "minio>=7.2.0",
    "mlflow-skinny>=2.20.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "sqlalchemy>=2.0.0",
    "temporalio>=1.7.0",
]

[dependency-groups]
dev = [
    # alembic: mlflow-skinny's SqlAlchemyStore backend imports it for db
    # migrations. It was only ever present transitively via the federated
    # learning framework removed in Phase 3d, whose own dependency on it
    # masked this gap. Tests need it because tests/conftest.py points
    # MLFLOW_TRACKING_URI at sqlite:///:memory:, which routes through
    # SqlAlchemyStore -- production points at a real MLflow HTTP server and
    # never touches this path.
    "alembic",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.15.5",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Matches active-fed's selection, which was verified to produce identical
# results under ruff 0.15.4 and 0.16.3 -- an explicit select is what stops a
# ruff upgrade from turning CI red with no code change. Without this file,
# `ruff check` inherits whatever defaults the installed version ships: 0.15.5
# passed, 0.16.3 raised 72 findings from rule families this project never
# opted into (BLE001, S110, PLW1510 and friends).
#
# line-length is 120 rather than active-fed's 100: the long lines are almost
# all inside KFP component bodies that embed shell and YAML, where wrapping
# hurts readability. 100 would mean 40 manual edits in FL code unrelated to
# CI; 120 means 7.
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
